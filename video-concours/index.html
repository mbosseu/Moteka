<!doctype html>
<html lang="fr"
  data-composition-variables='[{"id":"url","type":"string","label":"Adresse du jeu","default":"fight-and-furious.boxingcenter.fr"},{"id":"accent","type":"color","label":"Rouge Moteka","default":"#d11414"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #0a0a0b; --ink: #f4f2ef; --accent: #d11414; --vif: #ff2a2a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #bandeau { position: absolute; left: 0; right: 0; top: 150px; height: 104px; display: flex; justify-content: center; z-index: 50; }
      #bandeau .b-in { display: flex; align-items: center; gap: 22px; padding: 14px 40px 6px; background: #0a0a0b; color: #f4f2ef; border: 4px solid #ff2a2a;
        font: 400 74px/1 "League Gothic", sans-serif; text-transform: uppercase; letter-spacing: .04em; }
      #bandeau .b-in i { font-style: normal; color: #ff2a2a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36.2" data-width="1080" data-height="1920">

      <!-- Calage : Bandolero 90 bpm, temps = 0,667 s, temps forts (1er temps de mesure) à 1,317 + n × 2,667 s.
           Voix off V2 à poser plus tard (SCRIPT-VOIX-V2.md) : l.1 ≈ 0,3 s · l.2 ≈ 6,65 · l.3 ≈ 9,32 · l.4 ≈ 11,98
           · l.5 ≈ 19,98 · l.6 ≈ 25,32 · l.7 ≈ 31,3. Baisser alors la musique sous la voix (≈ 0,25). -->

      <!-- scènes -->
      <div id="lots" class="clip" data-composition-id="lots" data-composition-src="compositions/lots.html"
        data-start="0" data-duration="9.317" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="annonce" class="clip" data-composition-id="annonce" data-composition-src="compositions/annonce.html"
        data-start="9.317" data-duration="10.666" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="tickets" class="clip" data-composition-id="tickets" data-composition-src="compositions/tickets.html"
        data-start="19.983" data-duration="5.334" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="roulette" class="clip" data-composition-id="roulette" data-composition-src="compositions/roulette.html"
        data-start="25.317" data-duration="5.333" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="fin" class="clip" data-composition-id="fin" data-composition-src="compositions/fin.html"
        data-start="30.65" data-duration="5.55" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"url":"fight-and-furious.boxingcenter.fr"}'></div>

      <!-- en permanence en haut -->
      <div id="bandeau" class="clip" data-start="0" data-duration="36.2" data-track-index="2"><span class="b-in"><i>●</i> Jeu concours gratuit</span></div>

      <!-- musique : Bandolero bien présente (pas encore de voix) -->
      <audio id="musique" class="clip" src="assets/music/bandolero.mp3" data-start="0" data-duration="36.2" data-track-index="11" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.85},{"t":35.2,"v":0.85},{"t":36.2,"v":0}]}]}'></audio>

      <!-- bruitages calés sur l'image -->
      <audio id="s00" class="clip" src="assets/sfx/moteur-montee.wav" data-start="0" data-duration="2.6" data-track-index="20" data-volume="0.7"></audio>
      <audio id="s01" class="clip" src="assets/sfx/impact.wav" data-start="1.317" data-duration="2.62" data-track-index="21" data-volume="0.9"></audio>
      <audio id="s02" class="clip" src="assets/sfx/clic.mp3" data-start="3.983" data-duration="0.37" data-track-index="22" data-volume="1.5"></audio>
      <audio id="s03" class="clip" src="assets/sfx/impact.wav" data-start="6.65" data-duration="2.62" data-track-index="23" data-volume="0.9"></audio>
      <audio id="s04" class="clip" src="assets/sfx/whoosh.wav" data-start="8.9" data-duration="4.05" data-track-index="24" data-volume="0.7"></audio>
      <audio id="s05" class="clip" src="assets/sfx/impact.wav" data-start="9.317" data-duration="2.62" data-track-index="25" data-volume="0.8"></audio>
      <audio id="s06" class="clip" src="assets/sfx/whoosh.wav" data-start="11.75" data-duration="4.05" data-track-index="26" data-volume="0.6"></audio>
      <audio id="s07" class="clip" src="assets/sfx/clic.mp3" data-start="14.65" data-duration="0.37" data-track-index="27" data-volume="1.5"></audio>
      <audio id="s08" class="clip" src="assets/sfx/clic.mp3" data-start="15.317" data-duration="0.37" data-track-index="28" data-volume="1.5"></audio>
      <audio id="s09" class="clip" src="assets/sfx/clic.mp3" data-start="15.983" data-duration="0.37" data-track-index="29" data-volume="1.5"></audio>
      <audio id="s10" class="clip" src="assets/sfx/clic.mp3" data-start="16.65" data-duration="0.37" data-track-index="30" data-volume="1.5"></audio>
      <audio id="s11" class="clip" src="assets/sfx/clic.mp3" data-start="17.317" data-duration="0.37" data-track-index="31" data-volume="1.5"></audio>
      <audio id="s12" class="clip" src="assets/sfx/clic.mp3" data-start="17.983" data-duration="0.37" data-track-index="32" data-volume="1.5"></audio>
      <audio id="s13" class="clip" src="assets/sfx/impact.wav" data-start="17.317" data-duration="2.62" data-track-index="33" data-volume="0.6"></audio>
      <audio id="s14" class="clip" src="assets/sfx/whoosh.wav" data-start="19.75" data-duration="4.05" data-track-index="34" data-volume="0.6"></audio>
      <audio id="s15" class="clip" src="assets/sfx/clic.mp3" data-start="20.65" data-duration="0.37" data-track-index="35" data-volume="1.6"></audio>
      <audio id="s16" class="clip" src="assets/sfx/clic.mp3" data-start="21.317" data-duration="0.37" data-track-index="36" data-volume="1.6"></audio>
      <audio id="s17" class="clip" src="assets/sfx/clic.mp3" data-start="21.983" data-duration="0.37" data-track-index="37" data-volume="1.6"></audio>
      <audio id="s18" class="clip" src="assets/sfx/impact.wav" data-start="22.65" data-duration="2.62" data-track-index="38" data-volume="0.7"></audio>
      <audio id="s19" class="clip" src="assets/sfx/whoosh.wav" data-start="25.1" data-duration="4.05" data-track-index="39" data-volume="0.6"></audio>
      <audio id="s20" class="clip" src="assets/sfx/clic.mp3" data-start="27.983" data-duration="0.37" data-track-index="40" data-volume="1.8"></audio>
      <audio id="s21" class="clip" src="assets/sfx/clic.mp3" data-start="28.62" data-duration="0.37" data-track-index="41" data-volume="1.4"></audio>
      <audio id="s22" class="clip" src="assets/sfx/clic.mp3" data-start="29.24" data-duration="0.37" data-track-index="42" data-volume="1.4"></audio>
      <audio id="s23" class="clip" src="assets/sfx/gong.wav" data-start="30.65" data-duration="5.55" data-track-index="43" data-volume="1.0"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bandeau .b-in", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0);
      tl.fromTo("#bandeau .b-in i", { opacity: 1 }, { opacity: 0.25, duration: 0.333, ease: "none", repeat: 53, yoyo: true }, 0.65);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
