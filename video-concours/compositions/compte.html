  <script>
    (function () {
      // cadran : graduations et chiffres (décor fixe, calculé une fois)
      const NS = "http://www.w3.org/2000/svg", C = 500;
      const ang = rpm => (-120 + 240 * rpm / 9000) * Math.PI / 180;
      const pt = (a, r) => [C + r * Math.sin(a), C - r * Math.cos(a)];
      const grad = document.getElementById("c-graduations"), chif = document.getElementById("c-chiffres");
      for (let i = 0; i <= 90; i++) {
        const a = ang(i * 100), long = i % 10 === 0, mi = i % 5 === 0;
        const [x1, y1] = pt(a, 440), [x2, y2] = pt(a, long ? 380 : mi ? 405 : 420);
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2);
        l.setAttribute("stroke", i >= 70 ? "#ff2a2a" : "#f4f2ef"); l.setAttribute("stroke-width", long ? 9 : 4);
        grad.appendChild(l);
        if (long) {
          const [tx, ty] = pt(a, 330), t = document.createElementNS(NS, "text");
          t.setAttribute("x", tx); t.setAttribute("y", ty + 22); t.setAttribute("text-anchor", "middle");
          t.setAttribute("font-family", "League Gothic"); t.setAttribute("font-size", "68");
          t.setAttribute("fill", i >= 70 ? "#ff2a2a" : "#f4f2ef"); t.textContent = i / 10;
          chif.appendChild(t);
        }
      }
      const [ax, ay] = pt(ang(7000), 452), [bx, by] = pt(ang(9000), 452);
      document.getElementById("c-rouge-arc").setAttribute("d", `M${ax} ${ay} A452 452 0 0 1 ${bx} ${by}`);

      const tl = gsap.timeline({ paused: true });
      const aig = "#c-aiguille", O = { svgOrigin: "500 500" };
      const deg = rpm => -120 + 240 * rpm / 9000;
      const regime = (t, rpm, d, ease = "power2.out") => tl.to(aig, { rotation: deg(rpm), duration: d, ease, ...O }, t);
      gsap.set(aig, { rotation: deg(0), ...O });

      // accroche : le moteur monte dans les tours
      regime(0.05, 7000, 2.3, "power2.in");
      [2.5, 2.9, 3.3, 3.7, 4.1].forEach((t, i) => regime(t, i % 2 ? 7200 : 6750, 0.4, "sine.inOut"));

      // une entrée de titre : essuyage + décalage
      const entre = (sel, t, x = 40) => tl.fromTo(sel + " .c-in", { clipPath: "inset(0 100% 0 0)", x }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.22, ease: "expo.out" }, t);
      const claque = (sel, t) => tl.fromTo(sel + " .c-in", { scale: 1.25, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.18, ease: "back.out(2)" }, t);
      entre("#c-dates", 0); tl.set("#c-dates .c-in", { clipPath: "inset(0 0% 0 0)", x: 0 }, 0);
      entre("#c-soirs", 1.86); entre("#c-lots", 3.24);
      entre("#c-moteur", 4.51); claque("#c-moteur", 4.51);

      // passage de vitesse : chiffre, éclair du cadran, aiguille qui retombe puis remonte
      function vitesse(t, n, bas, haut, jusque) {
        tl.set("#c-rapport", { textContent: n }, t);
        tl.fromTo("#c-rapport", { scale: 1.35 }, { scale: 1, duration: 0.22, ease: "back.out(2.2)" }, t);
        tl.fromTo("#c-anneau", { attr: { "stroke-opacity": 0.95 } }, { attr: { "stroke-opacity": 0.18 }, duration: 0.3, ease: "power2.out" }, t);
        regime(t, bas, 0.14, "power3.out");
        regime(t + 0.14, haut, jusque - t - 0.2, "power1.in");
      }
      vitesse(5.6, "1", 2500, 6800, 7.6);
      vitesse(7.7, "2", 3000, 6900, 10.4);
      vitesse(10.5, "3", 3200, 7000, 12.55);
      vitesse(12.65, "4", 3400, 7100, 14.85);
      [["#c-j1", "#c-l1", 5.6], ["#c-j2", "#c-l2", 7.7], ["#c-j3", "#c-l3", 10.5], ["#c-j4", "#c-l4", 12.65]].forEach(([j, l, t]) => {
        entre(j, t, 24); entre(l, t + 0.08); claque(l, t + 0.08);
      });
      // la photo de fond pousse doucement pendant chaque soir
      [["#c-f0", 0, 5.6], ["#c-f1", 5.6, 2.1], ["#c-f2", 7.7, 2.8], ["#c-f3", 10.5, 2.15], ["#c-f4", 12.65, 2.25]].forEach(([f, t, d]) =>
        tl.fromTo(f + " img", { scale: 1.12 }, { scale: 1.02, duration: d, ease: "none" }, t));

      // 5e : monde rouge, les trois bandes MOTEKA balaient l'image, le cadran monte
      [["#c-b1", 0], ["#c-b2", 0.07], ["#c-b3", 0.14]].forEach(([b, dt], i) =>
        tl.fromTo(b, { x: -700 + i * 250, skewX: -34, opacity: 1 }, { x: 380 + i * 300, skewX: -34, opacity: 0.16, duration: 0.7, ease: "power3.out" }, 14.9 + dt));
      tl.to("#c-cadran-in", { scale: 0.62, y: -230, duration: 0.5, ease: "power3.inOut" }, 14.9);
      regime(14.9, 6900, 0.5);
      entre("#c-j5", 15.2, 24);
      vitesse(16.15, "5", 3600, 7700, 20.35);
      entre("#c-g1", 17.45); claque("#c-g1", 17.45); entre("#c-gsous", 17.6, 24);
      entre("#c-g2", 18.51); claque("#c-g2", 18.51);
      entre("#c-g3", 19.98); claque("#c-g3", 19.98);
      const ch = { v: 0 };
      tl.to(ch, { v: 320, duration: 0.6, ease: "power2.out", onUpdate: () => { document.getElementById("c-ch").textContent = Math.round(ch.v); } }, 19.98);

      // 6e : la finale, dans le rouge
      regime(20.4, 8900, 1.5, "power2.in");
      tl.to("#c-cadran-in", { scale: 0.56, y: -300, duration: 0.5, ease: "power3.inOut" }, 20.95);
      [["#c-n1", 0], ["#c-n2", 0.05], ["#c-n3", 0.1]].forEach(([b, dt], i) =>
        tl.fromTo(b, { x: 1600 + i * 250, y: 900, skewX: -34, opacity: 1 }, { x: 200 + i * 300, y: 900, skewX: -34, opacity: 0.85, duration: 0.6, ease: "power3.out" }, 23.31 + dt));
      entre("#c-j6", 21.25, 24);
      vitesse(22.02, "6", 5200, 8800, 23.25);
      gsap.set("#c-flash", { opacity: 0 });
      tl.fromTo("#c-flash", { opacity: 0.95 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 22.02);
      [23.4, 23.7, 24.0, 24.3, 24.6, 24.9, 25.2].forEach((t, i) => regime(t, i % 2 ? 9000 : 8650, 0.3, "sine.inOut"));
      tl.fromTo("#c-gta .c-in", { scale: 1.6, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(1.8)" }, 23.31);
      tl.fromTo("#c-flash", { opacity: 0.7 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 23.31);
      [12, -10, 8, -6, 4, 0].forEach((x, i) => tl.to("#c-cam", { x, y: -x * 0.6, duration: 0.05, ease: "none" }, 23.31 + i * 0.05));
      entre("#c-ps5", 24.59, 24);

      window.__timelines["compte"] = tl;
    })();
  </script>
