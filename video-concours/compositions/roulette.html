  <script>
    (function () {
      // roue : 12 secteurs numérotés 100 à 111 (décor fixe)
      const NS = "http://www.w3.org/2000/svg", g = document.getElementById("r-roue"), C = 500, R = 492;
      const couleurs = ["#d11414", "#0a0a0b", "#f4f2ef"];

        const a0 = (i * 30 - 15) * Math.PI / 180, a1 = (i * 30 + 15) * Math.PI / 180;
        const p = (a, r) => `${C + r * Math.sin(a)} ${C - r * Math.cos(a)}`;
        const s = document.createElementNS(NS, "path");
        s.setAttribute("d", `M${C} ${C} L${p(a0, R)} A${R} ${R} 0 0 1 ${p(a1, R)} Z`);
        const fond = couleurs[i % 3];
        s.setAttribute("fill", fond); s.setAttribute("stroke", "#0a0a0b"); s.setAttribute("stroke-width", "4");
        g.appendChild(s);
        const t = document.createElementNS(NS, "text"), am = i * 30 * Math.PI / 180;
        t.setAttribute("x", C + 380 * Math.sin(am)); t.setAttribute("y", C - 380 * Math.cos(am) + 30);

        t.setAttribute("fill", fond === "#f4f2ef" ? "#0a0a0b" : "#f4f2ef");
        t.setAttribute("transform", `rotate(${i * 30} ${C + 380 * Math.sin(am)} ${C - 380 * Math.cos(am) + 30})`);
        t.textContent = 100 + i;
        g.appendChild(t);

      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#r-label .r-in", { clipPath: "inset(0 100% 0 0)", x: 30 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.22, ease: "expo.out" }, 0.94);
      // la roue se range en haut, le ticket à gratter monte
      tl.to("#r-roue-in", { scale: 0.42, y: -290, duration: 0.45, ease: "power3.inOut" }, 2.72);
      tl.to("#r-index svg", { y: -20, scale: 0.6, transformOrigin: "50% 0%", duration: 0.45, ease: "power3.inOut" }, 2.72);

      // grattage en trois passes
